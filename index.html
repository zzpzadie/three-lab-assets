<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>three-lab-assets</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e7ecf1;
      --muted: #8b9aab;
      --link: #6cb6ff;
      --border: #2a3542;
      --folder: #e6c07b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 { font-size: 1.6rem; margin: 0 0 0.35rem; font-weight: 650; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; }
    code, .path {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.92em;
    }
    .base {
      display: inline-block;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      margin-bottom: 1.25rem;
      word-break: break-all;
    }
    #tree {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem 1rem;
    }
    #tree > ol {
      margin: 0;
      padding-left: 1.25rem;
    }
    details {
      margin: 0.15rem 0;
    }
    summary {
      cursor: pointer;
      list-style: none;
      color: var(--folder);
      font-weight: 600;
      padding: 0.2rem 0.15rem;
      border-radius: 6px;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
      content: "▸ ";
      display: inline-block;
      width: 1em;
      color: var(--muted);
    }
    details[open] > summary::before { content: "▾ "; }
    summary:hover { background: rgba(255,255,255,0.04); }
    ul, ol {
      margin: 0.15rem 0 0.35rem;
      padding-left: 1.35rem;
    }
    li { margin: 0.12rem 0; }
    a {
      color: var(--link);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 1rem;
    }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>three-lab-assets</h1>
    <p class="sub">three-lab 静态资源目录。按文件夹浏览，可展开 / 折叠。</p>
    <div class="base path" id="base">https://zzpzadie.github.io/three-lab-assets/</div>
    <div id="tree">加载中…</div>
    <p class="meta">清单来自 <code>manifest.json</code>。新增文件后运行 <code>node build-manifest.mjs</code> 再推送。</p>
  </main>
  <script>
    const BASE = new URL('.', location.href).href

    function buildTree(paths) {
      const root = { dirs: {}, files: [] }
      for (const p of paths) {
        const parts = p.split('/').filter(Boolean)
        let node = root
        for (let i = 0; i < parts.length - 1; i++) {
          const name = parts[i]
          if (!node.dirs[name]) node.dirs[name] = { dirs: {}, files: [] }
          node = node.dirs[name]
        }
        node.files.push(parts[parts.length - 1])
      }
      const sortKeys = (obj) => Object.keys(obj).sort((a, b) => a.localeCompare(b, 'en'))
      const sortFiles = (arr) =>
        [...arr].sort((a, b) => a.localeCompare(b, 'en', { numeric: true }))

      function walk(node) {
        for (const k of sortKeys(node.dirs)) walk(node.dirs[k])
        node.files = sortFiles(node.files)
      }
      walk(root)
      return root
    }

    function isNumericSequence(files) {
      if (files.length < 2) return false
      return files.every((f) => /^\d+\./.test(f))
    }

    function renderNode(node, prefix = '') {
      const frag = document.createDocumentFragment()

      const dirNames = Object.keys(node.dirs).sort((a, b) => a.localeCompare(b, 'en'))
      if (dirNames.length) {
        const ol = document.createElement('ol')
        for (const name of dirNames) {
          const li = document.createElement('li')
          const details = document.createElement('details')
          details.open = prefix === '' // 顶层默认展开
          const summary = document.createElement('summary')
          summary.textContent = name + '/'
          details.appendChild(summary)
          const child = renderNode(node.dirs[name], prefix ? `${prefix}/${name}` : name)
          details.appendChild(child)
          li.appendChild(details)
          ol.appendChild(li)
        }
        frag.appendChild(ol)
      }

      if (node.files.length) {
        const list = document.createElement(isNumericSequence(node.files) ? 'ol' : 'ul')
        if (isNumericSequence(node.files)) list.setAttribute('start', '1')
        for (const name of node.files) {
          const li = document.createElement('li')
          const a = document.createElement('a')
          const rel = prefix ? `${prefix}/${name}` : name
          a.href = BASE + rel
          a.innerHTML = `<span class="path">${name}</span>`
          a.title = BASE + rel
          li.appendChild(a)
          list.appendChild(li)
        }
        frag.appendChild(list)
      }

      return frag
    }

    document.getElementById('base').textContent = BASE

    fetch('manifest.json', { cache: 'no-cache' })
      .then((r) => {
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText)
        return r.json()
      })
      .then((paths) => {
        const treeEl = document.getElementById('tree')
        treeEl.replaceChildren()
        treeEl.appendChild(renderNode(buildTree(paths)))
      })
      .catch((err) => {
        document.getElementById('tree').innerHTML =
          `<p class="err">无法加载 manifest.json：${String(err)}</p>`
      })
  </script>
</body>
</html>
